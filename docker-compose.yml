services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kitrivo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1
      - DATABASE_URL=sqlite:///./app.db
      - UPLOADS_DIR=uploads
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1/
    container_name: kitrivo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend_uploads:
    driver: local

networks:
  app-network:
    driver: bridge
